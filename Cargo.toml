[workspace]
resolver = "3"
members = ["crates/abc-core", "crates/abcd", "crates/abc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
abc-core = { path = "crates/abc-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crokey = "1.5"
crossterm = "0.29"
devicons = "0.6"
insta = "1"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
terminal-colorsaurus = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
