[workspace]
resolver = "3"
members = ["crates/abc-core", "crates/abcd", "crates/abc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
abc-core = { path = "crates/abc-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
confique = { version = "0.4", default-features = false, features = ["toml"] }
crokey = "1.5"
crossterm = "0.29"
devicons = "0.6"
ignore = "0.4"
insta = "1"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
terminal-colorsaurus = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "process", "fs"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nucleo = "0.5"
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tui-input = "0.15"
tui-tree-widget = "0.24"

[workspace.lints.rust]
unsafe_code = "forbid"
