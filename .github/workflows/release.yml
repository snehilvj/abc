name: release

# A version tag, such as v0.1.0, builds abc and abcd for macOS and Linux and
# publishes them as a GitHub release. Run by hand, it builds the archives
# without publishing, to try a release before tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: The tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --format-version 1 --no-deps --locked |
            jq -r '.packages[] | select(.name == "abc") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi
      - run: cargo build --release --locked --target ${{ matrix.target }} -p abc -p abcd
      # abc and abcd side by side, as abc expects to find abcd.
      - name: Package
        run: |
          name="abc-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/abc target/${{ matrix.target }}/release/abcd \
            README.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: abc-*.tar.gz*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
