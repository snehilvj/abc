# What CI allows in the dependency tree: `cargo deny check`, or `just deny`.

[graph]
all-features = true

[advisories]
# Any advisory fails the check, unmaintained crates included. To accept one,
# add its id here with the reason.
ignore = [
    # Unmaintained, not vulnerable. syntect reads only the syntax definitions
    # built into abc with it, never anything from outside, and no syntect
    # release does without it yet.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1: unmaintained; syntect uses it only for abc's built-in syntaxes" },
]

[licenses]
# Licences compatible with abc's MIT licence.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# abc's own crates aren't published.
ignore = true

[bans]
# Two versions of one crate build twice: worth knowing, not worth failing over.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
